
<table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> Title </th>
        <td mat-cell *matCellDef="let 
     element"> {{element.title}} </td>
      </ng-container> 
    
      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef> Location </th>
        <td mat-cell *matCellDef="let 
     element"> {{element.location}} </td>
      </ng-container> 

      <ng-container matColumnDef="startDate">
        <th mat-header-cell *matHeaderCellDef> Start Date </th>
        <td mat-cell *matCellDef="let 
     element"> {{element.startDate}} </td>
      </ng-container> 

      <ng-container matColumnDef="endDate">
        <th mat-header-cell *matHeaderCellDef> End Date </th>
        <td mat-cell *matCellDef="let 
     element"> {{element.endDate}} </td>
      </ng-container> 
      
      <ng-container matColumnDef="actions">
         <th mat-header-cell *matHeaderCellDef> Actions </th>
         <td mat-cell *matCellDef="let 
      element"> 
            <button mat-raised-button color="primary" (click)="onEdit(element)">
               <mat-icon>visibility</mat-icon>
             </button>
         </td>
       </ng-container> 

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr> 
</table>

<mat-paginator [length]="opportunityPagination.totalItems"
             [pageSize]="opportunityPagination.itemsPerPage"
             [pageSizeOptions]="pageSizeOptions"
             showFirstLastButtons
             (page)="handlePageEvent($event)">
</mat-paginator>
